<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Menu</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; }
        #menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            font-family: Arial, sans-serif;
        }
        .menu-button {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            color: white;
            padding: 15px 30px;
            margin: 10px;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s;
            border-radius: 5px;
        }
        .menu-button:hover {
            background: rgba(255, 255, 255, 0.4);
        }
        #backButton {
            position: absolute;
            top: 20px;
            left: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div id="menu">
        <h1>Welkom! Kies een Omgeving waarin u wilt werken.</h1>
        <button class="menu-button" onclick="loadScene('scene1')">Rotating Cube</button>
        <button class="menu-button" onclick="loadScene('scene2')">Dancing Spheres</button>
        <button class="menu-button" onclick="loadScene('scene3')">Wave Pattern</button>
    </div>
    <button id="backButton" class="menu-button" onclick="showMenu()">Back to Menu</button>

    <script type="module">
      import { initScene, showMenu, loadScene } from './main.js';
  
      window.addEventListener('DOMContentLoaded', () => {
          initScene();
      });
  
      window.showMenu = showMenu;
      window.loadScene = loadScene;
  </script>
</body>
</html>
